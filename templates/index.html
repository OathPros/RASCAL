<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Service Portal</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="content" aria-labelledby="portal-title">
      <p class="eyebrow">YorkU Digital Services</p>
      <h1 id="portal-title">Service Portal</h1>
      <p class="intro">Find the right service, request support, and get connected faster.</p>
    </main>

    <section id="chat-widget" class="chat-widget" aria-label="Service assistant chat panel">
      <header class="chat-header">
        <h2>Service Assistant</h2>
        <p>Ask for help, recommendations, or service details.</p>
      </header>

      <div id="chat-log" class="chat-log" role="log" aria-live="polite" aria-label="Chat history"></div>
      <div id="action-buttons" class="action-buttons" aria-label="Suggested actions"></div>
      <div id="form-container" aria-label="Service form area"></div>

      <div class="chat-input-row">
        <label class="sr-only" for="chat-input">Describe what you need</label>
        <input id="chat-input" placeholder="Describe what you need..." autocomplete="off" />
        <button id="send-btn" type="button">Send</button>
      </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/survey-jquery@1.9.137/survey.jquery.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
